<!DOCTYPE html>
<html>
<head>
    <title>AI Study Planner</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
        }

        .container {
            background: white;
            padding: 20px;
            margin: 100px auto;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h1 {
            color: #2c3e50;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            width: 95%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🎓 Smart Study Planner</h1>

    <form method="POST">
        <input type="text" name="subjects" placeholder="Subjects (Math, DBMS)">
        <input type="number" name="hours" placeholder="Hours per day">
        <input type="date" name="date">
        <button type="submit">Generate Plan</button>
    </form>
</div>

</body>
</html>
