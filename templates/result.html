<!DOCTYPE html>
<html>
<head>
    <title>Study Plan</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

<h1>📘 Your Study Plan</h1>

<table>

<tr>
    <th>Day</th>
    <th>Subject</th>
    <th>Time</th>
</tr>

{% for item in timetable %}

<tr>
    <td>{{ item.day }}</td>
    <td>{{ item.subject }}</td>
    <td>{{ item.time }}</td>
</tr>

{% endfor %}

</table>

<br>

<a href="/">⬅ Back</a>

</div>

</body>
</html>
