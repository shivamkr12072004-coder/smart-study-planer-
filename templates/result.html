<!DOCTYPE html>
<html>
<head>
    <title>Timetable</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
        }

        .container {
            background: white;
            padding: 20px;
            margin: 50px auto;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #3498db;
            color: white;
        }

        td, th {
            padding: 10px;
            border: 1px solid black;
        }

        a {
            text-decoration: none;
            color: purple;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>📅 Your Study Plan</h1>

    <table>
        <tr>
            <th>Day</th>
            <th>Subject</th>
            <th>Time</th>
        </tr>

        {% for day, sub, time in timetable %}
        <tr>
            <td>{{ day }}</td>
            <td>{{ sub }}</td>
            <td>{{ time }}</td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="/">⬅ Back</a>
</div>

</body>
</html>
